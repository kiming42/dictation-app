<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>默書小助手 V2</title>
  <!-- 引入 Tesseract.js 作為相機圖片轉文字 (OCR) 的引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
    h2, h3 { margin-top: 0; }
    button { padding: 12px 15px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; color: white; margin-top: 5px; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    textarea { height: 100px; resize: none; }
    
    /* 頁面切換 */
    .page { display: none; }
    .page.active { display: block; }
    
    /* 默書清單項目 */
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px; }
    .list-item span { font-weight: bold; font-size: 18px; }
    
    /* 播放介面專用 */
    #play-screen { text-align: center; padding-top: 40px; }
    .word-display { font-size: 48px; font-weight: bold; margin: 30px 0; min-height: 70px; letter-spacing: 2px; }
    .word-display.hidden { filter: blur(15px); user-select: none; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 30px; }
    .big-btn { padding: 20px; font-size: 18px; }
    
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>

  <!-- 首頁：默書清單管理 -->
  <div id="home-screen" class="page active">
    <div class="card">
      <h2>📚 我的默書清單</h2>
      <div id="dictation-list"></div>
      <button class="btn-primary" onclick="showPage('edit-screen'); clearEditForm();" style="width: 100%;">+ 新增默書</button>
    </div>
    
    <div class="card">
      <h3>⚙️ 系統設定</h3>
      <div class="row">
        <div><label>Azure API Key:</label><input type="password" id="apiKey" onchange="saveConfig()"></div>
        <div><label>家長密碼 (4位數):</label><input type="password" id="parentPin" placeholder="預設: 1234" value="1234" onchange="saveConfig()"></div>
      </div>
    </div>
  </div>

  <!-- 新增/編輯默書 -->
  <div id="edit-screen" class="page">
    <div class="card">
      <h2>✏️ 新增/編輯默書</h2>
      <label>默書標題：</label>
      <input type="text" id="editTitle" placeholder="例如：中文第十課">
      
      <label>默書內容 (每行一個詞語)：</label>
      <textarea id="editContent" placeholder="蘋果&#10;香蕉"></textarea>
      
      <div class="row">
        <button class="btn-outline" onclick="triggerCamera()">📸 拍照自動輸入 (Beta)</button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)">
      </div>
      <p id="ocrStatus" style="color: #666; font-size: 14px; margin-top: 5px;"></p>

      <div class="row" style="margin-top: 20px;">
        <button class="btn-primary" onclick="saveDictation()">💾 儲存</button>
        <button class="btn-danger" onclick="showPage('home-screen')">取消</button>
      </div>
    </div>
  </div>

  <!-- 默書播放設定 -->
  <div id="setup-screen" class="page">
    <div class="card">
      <h2 id="setupTitle">準備默書</h2>
      <input type="hidden" id="setupId">
      
      <h3>播放模式</h3>
      <select id="playMode" onchange="toggleModeSettings()">
        <option value="auto">自動默書 (定時跳下一字)</option>
        <option value="manual">手動默書 (自己按下一字)</option>
      </select>

      <div id="autoSettings" class="row">
        <div>
          <label>重複次數：</label>
          <select id="setupRepeat"><option value="1">1次</option><option value="2" selected>2次</option></select>
        </div>
        <div>
          <label>詞語間隔(秒)：</label>
          <select id="setupDelay"><option value="4">4秒</option><option value="6" selected>6秒</option><option value="10">10秒</option></select>
        </div>
      </div>

      <div class="row" style="margin-top: 10px;">
        <div>
          <label>語速：</label>
          <select id="setupSpeed"><option value="0.75">慢速</option><option value="0.85" selected>適合</option><option value="1.0">正常</option></select>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; margin-top: 25px;">
          <input type="checkbox" id="hideText" checked style="width: auto; margin-right: 10px; transform: scale(1.5);">
          <label style="margin: 0; font-weight: bold;">隱藏文字 (需密碼)</label>
        </div>
      </div>

      <div class="row" style="margin-top: 20px;">
        <button class="btn-success" onclick="startPlay()">▶ 開始</button>
        <button class="btn-danger" onclick="showPage('home-screen')">返回</button>
      </div>
    </div>
  </div>

  <!-- 播放介面 -->
  <div id="play-screen" class="page">
    <h3 id="playProgress" style="color: #666;">進度: 1 / 10</h3>
    
    <div id="wordDisplay" class="word-display hidden">準備中...</div>
    <button class="btn-outline" id="unlockBtn" onclick="unlockText()" style="margin-bottom: 20px;">👁️ 顯示文字 (家長解鎖)</button>
    
    <div id="playStatus" style="font-size: 18px; color: var(--primary); font-weight: bold; height: 30px;"></div>

    <!-- 手動模式控制器 -->
    <div id="manualControls" class="controls-grid" style="display: none;">
      <button class="btn-primary big-btn" onclick="prevWord()">⏮ 上一個</button>
      <button class="btn-success big-btn" onclick="repeatWord()">🔄 再讀</button>
      <button class="btn-primary big-btn" onclick="nextWord()">下一個 ⏭</button>
    </div>
    
    <button class="btn-danger" onclick="stopPlay()" style="width: 100%; margin-top: 40px; padding: 15px; font-size: 18px;">⏹ 結束默書</button>
  </div>

<script>
  // --- 資料與狀態管理 ---
  let dictations = JSON.parse(localStorage.getItem('dictations')) || [];
  let currentWords = [];
  let currentIndex = 0;
  let isPlaying = false;
  let playAudio = null;
  let playMode = 'auto'; // 'auto' | 'manual'

  window.onload = () => {
    document.getElementById('apiKey').value = localStorage.getItem('azure_tts_key') || '';
    document.getElementById('parentPin').value = localStorage.getItem('parent_pin') || '1234';
    renderList();
  };

  function saveConfig() {
    localStorage.setItem('azure_tts_key', document.getElementById('apiKey').value.trim());
    localStorage.setItem('parent_pin', document.getElementById('parentPin').value.trim());
  }

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
  }

  // --- 默書清單 CRUD ---
  function renderList() {
    const listDiv = document.getElementById('dictation-list');
    listDiv.innerHTML = '';
    if(dictations.length === 0) listDiv.innerHTML = '<p style="color:#666;">尚未建立默書，請點擊新增。</p>';
    
    dictations.forEach(d => {
      listDiv.innerHTML += `
        <div class="list-item">
          <span>${d.title}</span>
          <div>
            <button class="btn-success" onclick="openSetup(${d.id})">▶ 默書</button>
            <button class="btn-danger" onclick="deleteDictation(${d.id})">刪</button>
          </div>
        </div>
      `;
    });
  }

  function clearEditForm() {
    document.getElementById('editTitle').value = '';
    document.getElementById('editContent').value = '';
    document.getElementById('ocrStatus').innerText = '';
  }

  function saveDictation() {
    const title = document.getElementById('editTitle').value.trim();
    const content = document.getElementById('editContent').value.trim();
    if(!title || !content) { alert('請填寫標題與內容！'); return; }
    
    dictations.push({ id: Date.now(), title, content });
    localStorage.setItem('dictations', JSON.stringify(dictations));
    renderList();
    showPage('home-screen');
  }

  function deleteDictation(id) {
    if(confirm('確定要刪除這個默書嗎？')) {
      dictations = dictations.filter(d => d.id !== id);
      localStorage.setItem('dictations', JSON.stringify(dictations));
      renderList();
    }
  }

  // --- 拍照 OCR 功能 (Beta) ---
  function triggerCamera() {
    document.getElementById('cameraInput').click();
  }

  async function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const statusText = document.getElementById('ocrStatus');
    statusText.innerText = "⏳ 正在辨識圖片中的文字，請稍候 (約需 10-20 秒)...";
    
    try {
      // 載入繁體中文與英文辨識包
      const result = await Tesseract.recognize(file, 'chi_tra+eng', {
        logger: m => { if(m.status === 'recognizing text') statusText.innerText = `⏳ 辨識中: ${Math.round(m.progress * 100)}%`; }
      });
      
      // 清理辨識出來的空白行
      const text = result.data.text.replace(/\n\s*\n/g, '\n').trim();
      document.getElementById('editContent').value = text;
      statusText.innerText = "✅ 辨識完成！請自行核對與修改錯漏字。";
    } catch (err) {
      console.error(err);
      statusText.innerText = "❌ 辨識失敗，請手動輸入。";
    }
  }

  // --- 默書播放邏輯 ---
  function openSetup(id) {
    const dic = dictations.find(d => d.id === id);
    document.getElementById('setupTitle').innerText = dic.title;
    document.getElementById('setupId').value = id;
    showPage('setup-screen');
  }

  function toggleModeSettings() {
    const mode = document.getElementById('playMode').value;
    document.getElementById('autoSettings').style.display = (mode === 'auto') ? 'flex' : 'none';
  }

  async function startPlay() {
    const apiKey = document.getElementById('apiKey').value;
    if(!apiKey) { alert('請先到首頁設定 Azure API Key！'); return; }

    const id = parseInt(document.getElementById('setupId').value);
    const dic = dictations.find(d => d.id === id);
    
    // 解析並清理詞語 (支援自行分段，透過換行符號區分)
    currentWords = dic.content.split('\n').map(w => w.trim()).filter(w => w.length > 0);
    currentIndex = 0;
    playMode = document.getElementById('playMode').value;
    isPlaying = true;

    // UI 切換
    document.getElementById('wordDisplay').classList.toggle('hidden', document.getElementById('hideText').checked);
    document.getElementById('unlockBtn').style.display = document.getElementById('hideText').checked ? 'inline-block' : 'none';
    document.getElementById('manualControls').style.display = (playMode === 'manual') ? 'grid' : 'none';
    
    showPage('play-screen');
    
    if(playMode === 'auto') {
      runAutoDictation();
    } else {
      updateManualUI();
      playCurrentWord();
    }
  }

  // 自動模式迴圈
  async function runAutoDictation() {
    const repeats = parseInt(document.getElementById('setupRepeat').value);
    const delay = parseInt(document.getElementById('setupDelay').value);
    
    for (; currentIndex < currentWords.length; currentIndex++) {
      if (!isPlaying) break;
      updatePlayProgress();
      
      for (let r = 1; r <= repeats; r++) {
        if (!isPlaying) break;
        document.getElementById('playStatus').innerText = `正在朗讀 (第 ${r} 次)`;
        await playCurrentWord();
        if (r < repeats && isPlaying) await sleep(1500); // 重複間隔
      }

      if (currentIndex < currentWords.length - 1 && isPlaying) {
        for (let cd = delay; cd > 0; cd--) {
          if (!isPlaying) break;
          document.getElementById('playStatus').innerText = `請書寫 ✍️ ... 剩餘 ${cd} 秒`;
          await sleep(1000);
        }
      }
    }
    
    if(isPlaying) document.getElementById('playStatus').innerText = '🎉 默書完成！';
  }

  // 手動模式控制器
  function updateManualUI() {
    updatePlayProgress();
    document.getElementById('playStatus').innerText = '等待中...';
  }

  function nextWord() {
    if(currentIndex < currentWords.length - 1) { currentIndex++; updateManualUI(); playCurrentWord(); }
  }
  
  function prevWord() {
    if(currentIndex > 0) { currentIndex--; updateManualUI(); playCurrentWord(); }
  }
  
  function repeatWord() {
    playCurrentWord();
  }

  function updatePlayProgress() {
    const word = currentWords[currentIndex];
    // 若文字隱藏，畫面用星號顯示長度，否則顯示原字
    const isHidden = document.getElementById('wordDisplay').classList.contains('hidden');
    document.getElementById('wordDisplay').innerText = isHidden ? '❓'.repeat(word.length) : word;
    document.getElementById('playProgress').innerText = `進度: ${currentIndex + 1} / ${currentWords.length}`;
  }

  function unlockText() {
    const pin = localStorage.getItem('parent_pin') || '1234';
    if(prompt('請輸入家長密碼：') === pin) {
      document.getElementById('wordDisplay').classList.remove('hidden');
      document.getElementById('unlockBtn').style.display = 'none';
      updatePlayProgress(); // 更新文字顯示
    } else {
      alert('密碼錯誤！');
    }
  }

  function stopPlay() {
    isPlaying = false;
    if(playAudio) { playAudio.pause(); playAudio = null; }
    showPage('home-screen');
  }

  // --- Azure TTS 引擎 ---
  function playCurrentWord() {
    return new Promise(async (resolve) => {
      const word = currentWords[currentIndex];
      const apiKey = localStorage.getItem('azure_tts_key');
      const speed = document.getElementById('setupSpeed').value;
      const lang = /[a-zA-Z]/.test(word) ? 'en-US' : 'zh-HK';
      const voice = lang === 'en-US' ? 'en-US-AvaNeural' : 'zh-HK-HiuGaaiNeural';
      
      document.getElementById('playStatus').innerText = '🔊 朗讀中...';
      
      const ssml = `<speak version='1.0' xml:lang='${lang}'><voice name='${voice}'><prosody rate='${speed}'>${word}</prosody></voice></speak>`;
      
      try {
        const response = await fetch('https://eastasia.tts.speech.microsoft.com/cognitiveservices/v1', {
          method: 'POST',
          headers: { 'Ocp-Apim-Subscription-Key': apiKey, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-16khz-128kbitrate-mono-mp3' },
          body: ssml
        });
        
        const blob = await response.blob();
        playAudio = new Audio(URL.createObjectURL(blob));
        playAudio.onended = () => { document.getElementById('playStatus').innerText = ''; resolve(); };
        playAudio.play();
      } catch (e) {
        console.error(e);
        resolve();
      }
    });
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
</script>

</body>
</html>
