<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音朗讀練習器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:secondary {
            background-color: #6c757d;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>語音朗讀練習器</h1>

    <div class="control-group">
        <label for="textInput">輸入文字（每行一句）：</label>
        <textarea id="textInput" placeholder="在此輸入要朗讀的句子..."></textarea>
    </div>

    <div class="control-group">
        <label for="voiceSelect">選擇語音：</label>
        <select id="voiceSelect"></select>
    </div>

    <div class="control-group">
        <label for="repeatCount">每句重複朗讀次數：</label>
        <input type="number" id="repeatCount" value="1" min="1" max="10">
    </div>

    <div class="control-group">
        <label for="pauseDuration">句間停頓時間（秒）：</label>
        <input type="number" id="pauseDuration" value="1" min="0" max="30" step="0.5">
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="autoMode">
        <label for="autoMode" style="display:inline; font-weight:normal;">自動模式（自動依序朗讀所有行）</label>
    </div>

    <div class="btn-container">
        <button id="startBtn">開始朗讀</button>
        <button id="nextBtn" style="background-color: #28a745;" disabled>下一句</button>
        <button id="stopBtn" style="background-color: #dc3545;" disabled>停止</button>
    </div>

    <div id="status">狀態：就緒</div>

    <script>
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const repeatCountInput = document.getElementById('repeatCount');
        const pauseDurationInput = document.getElementById('pauseDuration');
        const autoModeCheckbox = document.getElementById('autoMode');
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');

        let voices = [];
        let isPlaying = false;
        let currentUtterance = null;
        let pauseTimer = null;
        let countdownTimer = null;

        // 載入可用語音清單
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // 處理英文句號轉讀 "full stop"
        function processTextForSpeech(text, lang) {
            if (lang && lang.toLowerCase().startsWith('en')) {
                // 將句號替換為 " full stop "，避免連續句號混亂
                return text.replace(/\./g, ' full stop ');
            }
            return text;
        }

        // 狀態變數控制
        let playbackQueue = [];
        let currentIndex = 0;
        let currentRepeat = 0;
        let totalRepeats = 1;

        function updateStatus(msg) {
            statusDiv.textContent = `狀態：${msg}`;
        }

        function stopPlayback() {
            window.speechSynthesis.cancel();
            clearTimeout(pauseTimer);
            clearInterval(countdownTimer);
            isPlaying = false;
            startBtn.disabled = false;
            nextBtn.disabled = true;
            stopBtn.disabled = true;
            updateStatus('已停止');
        }

        startBtn.addEventListener('click', () => {
            const rawText = textInput.value.trim();
            if (!rawText) {
                alert('請輸入要朗讀的文字！');
                return;
            }

            playbackQueue = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            if (playbackQueue.length === 0) return;

            currentIndex = 0;
            currentRepeat = 0;
            totalRepeats = parseInt(repeatCountInput.value) || 1;

            isPlaying = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            nextBtn.disabled = false;

            playNextStep();
        });

        nextBtn.addEventListener('click', () => {
            if (!isPlaying) return;
            window.speechSynthesis.cancel();
            clearTimeout(pauseTimer);
            clearInterval(countdownTimer);
            
            // 手動下一句：直接跳到下一行，重置重複次數
            currentIndex++;
            currentRepeat = 0;
            playNextStep();
        });

        stopBtn.addEventListener('click', stopPlayback);

        function playNextStep() {
            if (!isPlaying) return;

            if (currentIndex >= playbackQueue.length) {
                updateStatus('朗讀完畢');
                stopPlayback();
                return;
            }

            const currentLine = playbackQueue[currentIndex];
            const selectedVoice = voices[voiceSelect.value];
            const lang = selectedVoice ? selectedVoice.lang : '';
            
            // 轉換文字（英文加入 full stop）
            const processedText = processTextForSpeech(currentLine, lang);

            currentRepeat++;
            updateStatus(`正在朗讀 [第 ${currentIndex + 1}/${playbackQueue.length} 行] (重複 ${currentRepeat}/${totalRepeats})\n內容: ${currentLine}`);

            currentUtterance = new SpeechSynthesisUtterance(processedText);
            if (selectedVoice) {
                currentUtterance.voice = selectedVoice;
            }

            currentUtterance.onend = () => {
                if (!isPlaying) return;

                if (currentRepeat < totalRepeats) {
                    // 同一句還需重複，進入停頓
                    handlePause(() => {
                        playNextStep();
                    });
                } else {
                    // 該行重複完畢
                    currentRepeat = 0;
                    currentIndex++;

                    if (autoModeCheckbox.checked) {
                        // 自動模式：停頓後進入下一句
                        handlePause(() => {
                            playNextStep();
                        });
                    } else {
                        // 非自動模式：朗讀完該句後停止，等待使用者操作
                        updateStatus(`第 ${currentIndex} 行朗讀完成。請點擊「下一句」或「開始朗讀」。`);
                        startBtn.disabled = false;
                        nextBtn.disabled = true;
                        stopBtn.disabled = true;
                        isPlaying = false;
                    }
                }
            };

            currentUtterance.onerror = (e) => {
                console.error('語音播放錯誤', e);
                stopPlayback();
            };

            window.speechSynthesis.speak(currentUtterance);
        }

        function handlePause(callback) {
            const pauseSeconds = parseFloat(pauseDurationInput.value) || 0;
            if (pauseSeconds <= 0) {
                callback();
                return;
            }

            let timeLeft = pauseSeconds;
            updateStatus(`句間停頓中... 剩餘 ${timeLeft.toFixed(1)} 秒`);

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                } else {
                    updateStatus(`句間停頓中... 剩餘 ${timeLeft.toFixed(1)} 秒`);
                }
            }, 100);

            pauseTimer = setTimeout(() => {
                clearInterval(countdownTimer);
                callback();
            }, pauseSeconds * 1000);
        }
    </script>
</body>
</html>
